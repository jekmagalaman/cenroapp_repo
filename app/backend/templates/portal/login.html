<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | CENRO Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
      :root { --p-primary:#1B5E20; --p-primary-dark:#0D4A17; --p-secondary:#003391; }
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, var(--p-primary) 0%, var(--p-primary-dark) 50%, var(--p-secondary) 100%);
      }
      .card { border-radius: 18px; }
    </style>
  </head>
  <body class="d-flex align-items-center">
    <div class="container px-3">
      <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
          <div class="text-center text-white mb-4">
            <div class="fw-bold fs-3">CENRO Admin Portal</div>
            <div class="opacity-75">Certificate of Inspection</div>
          </div>
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <h5 class="mb-3">Sign in</h5>

              {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-danger py-2">{{ message }}</div>
                {% endfor %}
              {% endif %}

              <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <input class="form-control" name="username" autocomplete="username" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input class="form-control" type="password" name="password" autocomplete="current-password" required />
                </div>
                <button class="btn btn-success w-100" style="background: var(--p-primary); border-color: var(--p-primary);">
                  Login
                </button>
              </form>

              <div class="text-muted small mt-3">
                Note: Only staff/admin accounts can access this portal.
              </div>
            </div>
          </div>
          <div class="text-center text-white-50 small mt-3">
            Go to Django Admin: <a class="link-light" href="/admin/">/admin/</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
